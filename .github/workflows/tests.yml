name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint with ruff
        run: |
          pip install -r requirements-dev.txt
          ruff check .

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Smoke-test backend and dashboard
        run: |
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://localhost:8000/docs
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://localhost:8501/_stcore/health

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the test suite
        # The suite is fully deterministic and offline; no real LLM provider is
        # called. A dummy key only satisfies client construction at import time.
        env:
          OPENAI_API_KEY: test-key-not-used
        run: python -m pytest -p no:warnings
